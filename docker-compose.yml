services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fierce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fiercefitness}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./.stack-data/postgres:/var/lib/postgresql/data
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fierce}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fiercefitness}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SQL_ECHO: ${SQL_ECHO:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ROOT_PATH: /api
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fiercefitness.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_TEST_USERS: ${SEED_TEST_USERS:-true}
      TRAINER_PASSWORD: ${TRAINER_PASSWORD:-Trainer123!}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD:-Member123!}
    depends_on:
      db:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - backend
    cpus: 0.5
    mem_limit: 64m